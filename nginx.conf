map $http_accept $spa_fallback {
    default         /index.html;
    "~*text/markdown" /index.md;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    add_header Link '</sitemap.xml>; rel="sitemap", </.well-known/api-catalog>; rel="api-catalog"' always;
    add_header Vary "Accept" always;

    types {
        text/html html htm;
        text/markdown md markdown;
        text/css css;
        application/javascript js mjs;
        application/json json;
        application/linkset+json linkset;
        image/png png;
        image/jpeg jpg jpeg;
        image/gif gif;
        image/x-icon ico;
        image/svg+xml svg;
        font/woff2 woff2;
        font/woff woff;
    }

    location = /index.md {
        default_type text/markdown;
    }

    location = / {
        try_files $spa_fallback =404;
    }

    location = /.well-known/api-catalog {
        default_type application/linkset+json;
        try_files $uri =404;
    }

    location /.well-known/ {
        default_type application/json;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $spa_fallback;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/markdown text/css application/json application/linkset+json application/javascript text/xml application/xml image/svg+xml;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
}
