map $http_accept $markdown_requested {
    default         0;
    "~*text/markdown" 1;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    add_header Link '</sitemap.xml>; rel="sitemap", </.well-known/api-catalog>; rel="api-catalog"' always;

    location = /index.md {
        types { }
        default_type "text/markdown; charset=utf-8";
    }

    location = / {
        if ($markdown_requested) {
            rewrite ^ /index.md break;
        }
        try_files $uri $uri/ /index.html;
    }

    location = /.well-known/api-catalog {
        add_header Content-Type "application/linkset+json" always;
        try_files $uri =404;
    }

    location /.well-known/ {
        add_header Content-Type "application/json" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
