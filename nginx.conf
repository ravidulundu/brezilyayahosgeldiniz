map $http_accept $spa_fallback {
    default         /index.html;
    "~*text/markdown" /index.md;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header Link '</sitemap.xml>; rel="sitemap", </.well-known/api-catalog>; rel="api-catalog"' always;
    add_header Vary "Accept" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self'; connect-src 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;

    types {
        text/html html htm;
        text/markdown md markdown;
        text/css css;
        application/javascript js mjs;
        application/json json;
        application/linkset+json linkset;
        image/png png;
        image/jpeg jpg jpeg;
        image/gif gif;
        image/webp webp;
        image/avif avif;
        image/x-icon ico;
        image/svg+xml svg;
        font/woff2 woff2;
        font/woff woff;
        text/plain txt;
        application/xml xml;
    }

    location = /index.md {
        default_type text/markdown;
    }

    location = / {
        try_files $spa_fallback =404;
    }

    location = /.well-known/api-catalog {
        default_type application/linkset+json;
        try_files $uri =404;
    }

    location /.well-known/ {
        default_type application/json;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|avif|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
    }

    gzip on;
    gzip_types text/plain text/markdown text/css application/json application/linkset+json application/javascript text/xml application/xml image/svg+xml;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
}
